<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priya's Portfolio</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #f7f3ff, #e7f5ff);
    }
    main {
      width: min(680px, 100%);
      padding: clamp(2rem, 6vw, 4.5rem);
      border: 1px solid rgba(23, 32, 51, 0.1);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(59, 71, 110, 0.14);
      backdrop-filter: blur(10px);
    }
    p { margin: 0 0 0.8rem; color: #5d6474; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 12ch; font-size: clamp(2.6rem, 8vw, 5rem); line-height: 0.98; letter-spacing: -0.05em; }
    .accent { color: #6d4aff; }
  </style>
</head>
<body>
  <main>
    <p>My first live website</p>
    <h1>Hi, I'm Priya <span class="accent">— welcome to my portfolio.</span></h1>
  </main>
</body>
</html>
